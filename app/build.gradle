plugins {
    alias(libs.plugins.android.application)
}

// Debug-only lecturer auto sign-in. The credentials come from local.properties,
// which is never committed to Git. Release builds get empty values, so they never auto sign in.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def devLecturerUser = localProps.getProperty('dev.lecturer.username', '')
def devLecturerPass = localProps.getProperty('dev.lecturer.password', '')

// Where the app finds the backend. Set api.base.url in local.properties:
//   USB phone (adb reverse):  http://localhost:5000/api/   (the default)
//   Hosted backend:           https://your-service.onrender.com/api/
// The trailing slash matters. A hosted address must be https.
def apiBaseUrl = localProps.getProperty('api.base.url', 'http://localhost:5000/api/')

android {
    namespace 'com.example.mustudentsync'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.mustudentsync"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField "String", "DEV_LECTURER_USERNAME", "\"${devLecturerUser}\""
            buildConfigField "String", "DEV_LECTURER_PASSWORD", "\"${devLecturerPass}\""
        }
        release {
            buildConfigField "String", "DEV_LECTURER_USERNAME", "\"\""
            buildConfigField "String", "DEV_LECTURER_PASSWORD", "\"\""
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    // Room (local database)
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    // Lifecycle (ViewModel + LiveData)
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // WorkManager: background sync of offline changes (Activity E)
    implementation "androidx.work:work-runtime:2.9.1"

    // Push notifications (Firebase Cloud Messaging)
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
}

// Firebase is set up only when app/google-services.json is present (downloaded from the
// Firebase console, never committed). Without it the app still builds; push is simply off.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
